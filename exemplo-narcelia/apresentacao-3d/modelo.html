<style>

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #151917; --surface: #1d2220; --ink: #e8ebe7; --muted: #9aa49f; --line: #333b37;
  --accent: #6fb3aa; --accent-ink: #0f1513; --sky: #1b201e; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #151917; --surface: #1d2220; --ink: #e8ebe7; --muted: #9aa49f; --line: #333b37;
  --accent: #6fb3aa; --accent-ink: #0f1513; --sky: #1b201e; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; overflow: hidden; }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--surface); }
.marca { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.marca h1 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 20px; letter-spacing: -0.01em; text-wrap: balance; }
.marca span { font-family: var(--f-mono); font-size: 11px; color: var(--muted); letter-spacing: 0.04em; }
nav.cenas { display: flex; flex-wrap: wrap; gap: 4px; margin-left: auto; }
nav.cenas button { font: 600 13px var(--f-body); color: var(--ink); background: transparent; border: 1px solid var(--line);
  padding: 7px 12px; border-radius: 6px; cursor: pointer; }
nav.cenas button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
nav.cenas button:focus-visible, .ctrl button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  padding: 7px 10px; border-radius: 6px; cursor: pointer; }

  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; }

@media (max-width: 820px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100%; }

<script>
const DADOS = __DADOS__;

const ASSETS = __ASSETS__;

const FICHAS = {

    nums: [["184,5 m²", "área útil"], ["5", "unidades"], ["5", "medidores"], ["35,5 m", "profundidade"]],

  "proposta-03": { titulo: "Proposta 03", sub: "Variação da 02: poço de ventilação no lugar do jardim, banhos reorganizados e gourmet aberto para a piscina.",
    nums: [["172,5 m²", "área útil"], ["3", "suítes"], ["9,2 m²", "parede a demolir"], ["2,3 m²", "parede nova"]],
    itens: ["Poço de ventilação aberto, com despensa voltada para a cozinha.", "Lavabo no fim do estar e jantar, no banheiro existente.",
            "Banho da master e da suíte 2 no antigo cômodo E; closet master ampliado.", "Gourmet com lavabo no fundo e quatro portas de correr para a piscina."] },
  "proposta-04": { titulo: "Proposta 04", sub: "Revisão da 02: entrada pela fachada, jantar e cozinha até o vidro, estar com TV e lazer com banho próprio.",
    nums: [["171 m²", "área útil"], ["3", "suítes"], ["9,8 m²", "parede a demolir"], ["1,8 m²", "parede nova"]],
    itens: ["Entrada social na fachada; a antiga sacada vira recuo até o vidro.", "Jantar e cozinha integrados; jardim de inverno reduzido até o lavabo.",
            "Estar com pé-direito duplo e sala de TV no final, junto ao lavabo.", "Banho master pelo closet; banho da suíte 2 no antigo banho de serviço.",
            "Antigo banho da master vira banho do lazer; gourmet em salão único aberto para a piscina.",
            "Mobiliário indicativo do layout proposto (botão Mobiliário liga e desliga)."] }
};
const IDS = ["existente", "proposta-01", "proposta-02", "proposta-03", "proposta-04"];
const CORES = { social: "#e3d3b8", intimo: "#cbd6dc", molhado: "#a9c7c9", servico: "#d9d4c6", circulacao: "#e7e3da",
                lazer: "#d7c3a3", externo: "#b9c7a5", neutro: "#dcd9d1" };
const NOMES_CORES = { social: "Social", intimo: "Íntimo", molhado: "Áreas molhadas", servico: "Cozinha e serviço",
                      circulacao: "Circulação", lazer: "Gourmet", externo: "Área externa" };

/* ---------- cena ---------- */
const palco = document.getElementById("palco");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
palco.prepend(renderer.domElement);
const cena = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 400);
const controles = new THREE.OrbitControls(camera, renderer.domElement);
controles.enableDamping = true; controles.maxPolarAngle = Math.PI * 0.49; controles.minDistance = 4; controles.maxDistance = 90;
const hemi = new THREE.HemisphereLight(0xffffff, 0x8a8f86, 0.75); cena.add(hemi);
const sol = new THREE.DirectionalLight(0xffffff, 0.75);
sol.position.set(-14, 26, 10); sol.castShadow = true; sol.shadow.mapSize.set(2048, 2048);
Object.assign(sol.shadow.camera, { left: -24, right: 24, top: 24, bottom: -24, near: 1, far: 80 });
cena.add(sol); cena.add(sol.target);

const L = DADOS.lote;
const cx = -(L.x0 + L.x1) / 200, cz = -(L.y0 + L.y1) / 200;
sol.target.position.set(cx, 0, cz); sol.position.set(cx - 12, 26, cz + 10);
const M = (c, extra) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.9, metalness: 0 }, extra || {}));
const MAT = { parede: M(0xf4f2ec), vidro: M(0x9cc7d6, { transparent: true, opacity: 0.38, roughness: 0.1 }), muro: M(0xc9c6bd, { transparent: true, opacity: 0.45 }),
  agua: M(0x3d9bc0, { roughness: 0.15 }), deck: M(0xa47d55), cobertura: M(0x8b9089, { transparent: true, opacity: 0.4 }), vaga: M(0x9a9a94),
  bancada: M(0x6d6a63), grade: M(0x6f6f6f) };

function forma(rings) {
  const conv = r => r.map(([x, y]) => new THREE.Vector2(-x / 100, y / 100));
  const s = new THREE.Shape(conv(rings[0]));
  rings.slice(1).forEach(h => s.holes.push(new THREE.Path(conv(h))));
  return s;
}
function extrusao(rings, h, mat, base) {
  const g = new THREE.ExtrudeGeometry(forma(rings), { depth: h / 100, bevelEnabled: false });
  g.rotateX(-Math.PI / 2); g.translate(0, (base || 0) / 100, 0);
  const m = new THREE.Mesh(g, mat); m.castShadow = true; m.receiveShadow = true; return m;
}
function caixa(b, z0, z1, mat) {
  const [x0, y0, x1, y1] = b; if (z1 <= z0) return null;
  const g = new THREE.BoxGeometry((x1 - x0) / 100, (z1 - z0) / 100, (y1 - y0) / 100);
  const m = new THREE.Mesh(g, mat); m.position.set(-(x0 + x1) / 200, (z0 + z1) / 200, -(y0 + y1) / 200);
  m.castShadow = true; m.receiveShadow = true; return m;
}
function rotulo(texto, area) {
  const c = document.createElement("canvas"); c.width = 512; c.height = 128;
  const k = c.getContext("2d");
  k.fillStyle = "rgba(29,35,32,0.82)"; const w = Math.min(500, 30 + texto.length * 17);
  k.beginPath(); k.roundRect ? k.roundRect((512 - w) / 2, 22, w, 84, 14) : k.rect((512 - w) / 2, 22, w, 84); k.fill();
  k.fillStyle = "#ffffff"; k.textAlign = "center"; k.font = "600 30px 'IBM Plex Sans', sans-serif";
  k.fillText(texto.length > 26 ? texto.slice(0, 25) + "…" : texto, 256, 60);
  k.font = "400 24px 'IBM Plex Mono', monospace"; k.fillStyle = "#cfe3df"; k.fillText(area.toFixed(2).replace(".", ",") + " m²", 256, 92);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false, transparent: true }));
  s.scale.set(2.6, 0.65, 1); s.renderOrder = 10; return s;
}
function centro(r) {
  let sx = 0, sy = 0; r.forEach(([x, y]) => { sx += x; sy += y; }); return [sx / r.length, sy / r.length];
}

/* mobiliario e vegetacao (propostas com layout): volumes extrudados + arvores */
const cacheMat = {};
const matCor = (c, vidro) => cacheMat[c + (vidro ? "v" : "")] ||
  (cacheMat[c + (vidro ? "v" : "")] = vidro ? M(c, { transparent: true, opacity: 0.3, roughness: 0.1 }) : M(c, { roughness: 0.8 }));
const GEO = { esfera: new THREE.SphereGeometry(1, 18, 12), cil: new THREE.CylinderGeometry(1, 1, 1, 14), cone: new THREE.ConeGeometry(1, 1, 10) };
function peca(geo, mat, sx, sy, sz, x, y, z) {
  const m = new THREE.Mesh(geo, mat); m.scale.set(sx, sy, sz); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; m.userData.compartilhada = true; return m;
}
function vegetal(g, [x, y, r, t]) {
  const X = -x / 100, Z = -y / 100, R = r / 100;
  if (t === "guardasol") { g.add(peca(GEO.cil, matCor(0x8a7a66), 0.025, 2.3, 0.025, X, 1.15, Z)); g.add(peca(GEO.cone, matCor(0xece4d2), R, 0.35, R, X, 2.45, Z)); }
  else if (t === "vaso_planta") { g.add(peca(GEO.cil, matCor(0xc4aa8c), R, 0.45, R, X, 0.225, Z)); g.add(peca(GEO.esfera, matCor(0x6fa257), R * 0.85, R * 0.75, R * 0.85, X, 0.45 + R * 0.6, Z)); }
  else if (t === "arbusto") g.add(peca(GEO.esfera, matCor(0x5f9a4e), R, R * 0.8, R, X, R * 0.7, Z));
  else { const h = 1.4 + R * 1.2; g.add(peca(GEO.cil, matCor(0x7a5c40), 0.09, h, 0.09, X, h / 2, Z));
         g.add(peca(GEO.esfera, matCor(0x4f8a44), R, R * 0.8, R, X, h + R * 0.4, Z)); g.add(peca(GEO.esfera, matCor(0x86bd68), R * 0.55, R * 0.45, R * 0.55, X - R * 0.25, h + R * 0.85, Z - R * 0.2)); }
}
let mostrarMoveis = true, gMoveis = null;

/* ---------- modo realista: propostas com layout (layoutNN.py) e prancha (pranchaNN.py) ----------
   Pisos com textura no padrao da prancha, luz de ceu HDRI, modelos reais (GLB CC0 do Poly Haven, ver CREDITOS.md)
   e pecas modeladas aqui (camas, sofas, armarios, bancadas, loucas...). Local: largura em X, profundidade em Z,
   costas em -Z, frente em +Z, base em y = 0 (mesma convencao dos GLB). */
const TXL = new THREE.TextureLoader(), cacheTex = {}, matR = {};
function tex(nome, rep, srgb) {
  const k = nome + "|" + rep; if (cacheTex[k]) return cacheTex[k];
  const t = TXL.load(ASSETS["texturas/" + nome] || ("texturas/" + nome + ".jpg")); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep); t.anisotropy = 8;
  if (srgb) t.encoding = THREE.sRGBEncoding; return (cacheTex[k] = t);
}
function compart(m) { m.userData.compartilhado = true; return m; }
function matTex(nome, metro, cor, extra) {     // metro = tamanho (m) de uma repeticao da textura
  const k = [nome, metro, cor, JSON.stringify(extra || {})].join("|"); if (matR[k]) return matR[k];
  return (matR[k] = compart(new THREE.MeshStandardMaterial(Object.assign({ map: tex(nome + "_diff", 1 / metro, true),
    normalMap: tex(nome + "_nor", 1 / metro), roughnessMap: tex(nome + "_rough", 1 / metro), color: cor }, extra || {}))));
}
function matLiso(cor, extra) {
  const k = "liso|" + cor + JSON.stringify(extra || {}); if (matR[k]) return matR[k];
  return (matR[k] = compart(new THREE.MeshStandardMaterial(Object.assign({ color: cor, roughness: 0.6, metalness: 0 }, extra || {}))));
}
function porcelanato(lado, base, junta) {      // placa quase lisa com rejunte (como o material real)
  const k = "porc|" + lado; if (matR[k]) return matR[k];
  const c = document.createElement("canvas"); c.width = c.height = 512; const g = c.getContext("2d");
  g.fillStyle = base; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 2600; i++) { g.fillStyle = Math.random() < 0.5 ? "rgba(255,255,255,0.035)" : "rgba(110,100,90,0.025)";
    g.fillRect(Math.random() * 512, Math.random() * 512, 2 + Math.random() * 24, 1 + Math.random() * 3); }
  g.fillStyle = junta; g.fillRect(0, 0, 512, 3); g.fillRect(0, 0, 3, 512);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1 / lado, 1 / lado); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8;
  return (matR[k] = compart(new THREE.MeshStandardMaterial({ map: t, roughness: 0.3, metalness: 0 })));
}
const PISO_R = {
  porc90: () => porcelanato(0.9, "#e8e3db", "#cdc6bb"), porc60: () => porcelanato(0.6, "#efefec", "#d0d0cb"),
  deck: () => matR.deck || (matR.deck = compart(new THREE.MeshStandardMaterial({ map: tex("madeira_diff", 1 / 1.4, true), normalMap: tex("deck_nor", 1 / 1.6), roughness: 0.75, color: 0xc89a6c }))), drenante: () => matTex("pavers", 1.0, 0xf4f1ec), pedra: () => matTex("pedra", 1.2, 0xfff6e8),
  gramado: () => matTex("grama", 2.0, 0x8fd06a), pedrisco: () => matTex("pedrisco", 0.8, 0xf7efe2),
  piscina: () => matLiso(0x2f95c8, { roughness: 0.04, metalness: 0.15, transparent: true, opacity: 0.9 }),
};
const MR = {
  tecido: () => matTex("tecido", 0.6, 0xe6dfd2), tecidoEsc: () => matTex("tecido", 0.6, 0x8f877b), linho: () => matR.linhoB || (matR.linhoB = compart(new THREE.MeshStandardMaterial({ color: 0xf3f1ec, normalMap: tex("linho_nor", 1 / 0.4), roughness: 0.92 }))),
  manta: () => matTex("tecido", 0.4, 0xc4835c), tapete: () => matTex("tapete", 0.8, 0xded6c8),
  madeira: () => matTex("madeira", 1.2, 0xffffff), madeiraClara: () => matTex("madeira_clara", 1.2, 0xfffaf0),
  travertino: () => matLiso(0xe4d6bf, { roughness: 0.32 }), pedra: () => matTex("pedra", 0.6, 0xf1eadf),
  inox: () => matLiso(0xc8cdd2, { metalness: 0.85, roughness: 0.3 }), preto: () => matLiso(0x0f1012, { roughness: 0.12, metalness: 0.2 }),
  ceramica: () => matLiso(0xfbfbf9, { roughness: 0.1 }), branco: () => matLiso(0xf2f1ed, { roughness: 0.5 }),
  metal: () => matLiso(0x2a2a2c, { metalness: 0.7, roughness: 0.4 }), cromo: () => matLiso(0xe0e4e7, { metalness: 1, roughness: 0.08 }),

function monta(i) {
  if (grupo) { cena.remove(grupo); grupo.traverse(o => { if (o.geometry && !o.userData.compartilhada) o.geometry.dispose(); if (o.material && o.material.map && !o.material.userData.compartilhado) o.material.map.dispose(); }); }
  grupo = new THREE.Group(); rotulos = [];
  const d = DADOS.cenarios[i], e = d.extras || {}, real = !!(e.itens && e.itens.length);
  modoReal(real);
  d.pisos.forEach(p => {
    const g = new THREE.ShapeGeometry(forma(p.r)); g.rotateX(-Math.PI / 2); g.translate(0, 0.01, 0);
    const mt = real && e.piso_m && PISO_R[e.piso_m[p.n]] ? PISO_R[e.piso_m[p.n]]() : M(CORES[p.k] || CORES.neutro);
    const m = new THREE.Mesh(g, mt); m.receiveShadow = true; grupo.add(m);
  });
  if (real) (e.externos || []).forEach((x, k) => {                    /* gramado, pisos externos, deck, borda e agua */
    const g = new THREE.ShapeGeometry(forma(x.r)); g.rotateX(-Math.PI / 2); g.translate(0, 0.002 + k * 0.0012, 0);
    const m = new THREE.Mesh(g, (PISO_R[x.m] || PISO_R.pedra)()); m.receiveShadow = true; grupo.add(m);
  });
  const vistos = new Set();
  d.pisos.forEach(p => {
    if (vistos.has(p.n)) return; vistos.add(p.n);
    const [x, y] = centro(p.r[0]); const s = rotulo(p.n, p.a); s.position.set(-x / 100, 1.6, -y / 100); grupo.add(s); rotulos.push(s);
  });
  d.paredes.forEach(w => grupo.add(extrusao(w.r, w.h, MAT.parede)));
  d.janelas.forEach(j => { [caixa(j.b, 0, j.s, MAT.parede), caixa(j.b, j.t, j.h, MAT.parede)].forEach(o => o && grupo.add(o));
    const b = j.b, fino = (b[2] - b[0]) < (b[3] - b[1]) ? [b[0] + 6, b[1], b[2] - 6, b[3]] : [b[0], b[1] + 6, b[2], b[3] - 6];
    const v = caixa(fino, j.s, j.t, MAT.vidro); if (v) { v.castShadow = false; grupo.add(v); } });
  d.vergas.forEach(v => { const o = caixa(v.b, v.f, v.h, MAT.parede); if (o) grupo.add(o); });
  if (e.deck && !real) grupo.add(caixa(e.deck, 0, 4, MAT.deck));
  if (e.piscina && !real) { grupo.add(caixa(e.piscina, 3, 6, M(0xe8e4da))); const p = e.piscina; grupo.add(caixa([p[0] + 20, p[1] + 20, p[2] - 20, p[3] - 20], 5, 7, MAT.agua)); }
  if (!real) (e.vagas || []).forEach(b => grupo.add(caixa(b, 0, 2, MAT.vaga)));
  (e.bancadas || []).forEach(b => grupo.add(caixa(b, 0, 90, MAT.bancada)));
  (e.grades || []).forEach(b => grupo.add(caixa(b, 0, 110, MAT.grade)));
  gMoveis = new THREE.Group(); gMoveis.visible = mostrarMoveis; grupo.add(gMoveis);
  (e.moveis || []).forEach(m => { if (real && !m.v) return;           /* no modo realista, so os vidros dos boxes vem dos volumes */
    const o = extrusao(m.r, m.z1 - m.z0, matCor(m.c, m.v), m.z0); if (m.v) o.castShadow = false; gMoveis.add(o); });
  if (real) montaItens(gMoveis, e.itens); else (e.arvores || []).forEach(a => vegetal(gMoveis, a));
  document.getElementById("bmov").hidden = !((e.moveis && e.moveis.length) || real);
  if (e.cobertura) { const b = e.cobertura; grupo.add(caixa(b, 300, 315, MAT.cobertura));
    [[b[0], b[1], b[2], b[1] + 15], [b[0], b[3] - 15, b[2], b[3]], [b[2] - 15, b[1], b[2], b[3]]].forEach(q => grupo.add(caixa(q, 315, 420, MAT.cobertura))); }
  grupo.traverse(o => { if (o.isSprite) o.visible = mostrarRotulos; });
  cena.add(grupo);
}

/* ---------- camera ---------- */
function vista3d() { camera.up.set(0, 1, 0); camera.position.set(cx + 16, 22, cz + 24); controles.target.set(cx, 0, cz); controles.update(); }
function vistaPlanta() { camera.up.set(0, 0, -1); camera.position.set(cx, 46, cz + 0.01); controles.target.set(cx, 0, cz); controles.update(); }
function ajusta() {
  const r = palco.getBoundingClientRect(); renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / Math.max(1, r.height); camera.updateProjectionMatrix();
}
function fundo() { cena.background = new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue("--sky").trim() || "#e4e6e2"); }
new ResizeObserver(ajusta).observe(palco);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", fundo);
new MutationObserver(fundo).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

/* ---------- interface ---------- */
let mostrarRotulos = true, girar = false;
const reduz = matchMedia("(prefers-reduced-motion: reduce)").matches;
const abas = document.getElementById("abas"), ficha = document.getElementById("ficha");
IDS.forEach((id, i) => {
  const b = document.createElement("button"); b.type = "button"; b.id = "aba-" + id; b.textContent = FICHAS[id].titulo;
  b.addEventListener("click", () => { location.hash = id; }); abas.appendChild(b);
});
function mostra(id) {
  const i = Math.max(0, IDS.indexOf(id)); const f = FICHAS[IDS[i]];
  abas.querySelectorAll("button").forEach((b, k) => b.setAttribute("aria-pressed", String(k === i)));
  monta(i);
  const usados = [...new Set(DADOS.cenarios[i].pisos.map(p => p.k))].filter(k => NOMES_CORES[k]);
  ficha.innerHTML = `<div><h2>${f.titulo}</h2><p class="sub">${f.sub}</p></div>
    <div class="numeros">${f.nums.map(([v, l]) => `<div><b>${v}</b><small>${l}</small></div>`).join("")}</div>
    <div><h3>Destaques</h3><ul>${f.itens.map(t => `<li>${t}</li>`).join("")}</ul></div>
    <div><h3>Cores dos pisos</h3><div class="legenda">${usados.map(k => `<span><i style="background:${CORES[k]}"></i>${NOMES_CORES[k]}</span>`).join("")}</div></div>
    <p class="rodape">Maquete de estudo, sem cobertura, para leitura dos ambientes. Paredes com 2,80 m; volume do estar com pé-direito duplo de 5,60 m. Medidas sujeitas à conferência em obra.</p>`;
}
const marca = (b, v) => b.setAttribute("aria-pressed", String(v));
document.getElementById("b3d").addEventListener("click", vista3d);
document.getElementById("bplanta").addEventListener("click", vistaPlanta);
document.getElementById("brot").addEventListener("click", e => { mostrarRotulos = !mostrarRotulos; marca(e.currentTarget, mostrarRotulos); rotulos.forEach(s => s.visible = mostrarRotulos); });
document.getElementById("bmov").addEventListener("click", e => { mostrarMoveis = !mostrarMoveis; marca(e.currentTarget, mostrarMoveis); if (gMoveis) gMoveis.visible = mostrarMoveis; });
document.getElementById("bgira").addEventListener("click", e => { girar = !girar; marca(e.currentTarget, girar); controles.autoRotate = girar && !reduz; });
controles.autoRotateSpeed = 0.6;
window.addEventListener("hashchange", () => mostra(location.hash.slice(1)));

fundo(); ajusta(); vista3d(); mostra(location.hash.slice(1) || "proposta-04");
(function anima() { requestAnimationFrame(anima); controles.update(); renderer.render(cena, camera); })();
</script>
